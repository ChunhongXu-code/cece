<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>波西和皮普的英语派对</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body {
            background: #e2f0cb; 
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            font-family: 'Times New Roman', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            touch-action: none; 
        }
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: #b5ead7; 
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,246,233,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .hidden { display: none !important; }
        
        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .title-img {
            height: 60px;
            object-fit: contain;
            border-radius: 10px;
        }
        h1 { font-size: 34px; color: #ff9aa2; margin: 0; }
        p { font-size: 18px; margin-bottom: 25px; color: #666; font-weight: bold; line-height: 1.5;}
        
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }
        button {
            padding: 12px 10px;
            font-size: 20px;
            font-weight: bold;
            color: #555;
            border: 4px solid #fff;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.9); }
        .btn-animal { background: #ffb7b2; }
        .btn-fruit { background: #e2f0cb; }
        .btn-clothes { background: #c7ceea; }
        .btn-object { background: #ffdac1; }
        .btn-vehicle { background: #b5ead7; grid-column: span 2; } 

        #timeBarContainer {
            position: absolute;
            top: env(safe-area-inset-top, 20px); 
            left: 20px;
            width: calc(100% - 40px);
            height: 15px;
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
            z-index: 5;
            overflow: hidden;
        }
        #timeBar {
            width: 100%;
            height: 100%;
            background: #ffb7b2;
            transition: width 1s linear;
        }
        #wordDisplay {
            position: absolute;
            top: 20%;
            left: 0;
            width: 100%;
            text-align: center;
            font-weight: bold;
            color: #ff9aa2;
            text-shadow: 4px 4px 0 #fff;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .word-en { font-size: 65px; }
        .word-zh { font-size: 40px; color: #ffb7b2; }
        
        #sleepScreen {
            background: #2c3e50;
            color: #ecf0f1;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="timeBarContainer"><div id="timeBar"></div></div>
        <div id="wordDisplay">
            <span class="word-en" id="textEn">Dog</span>
            <span class="word-zh" id="textZh">小狗</span>
        </div>

        <div id="startScreen" class="overlay">
            <div class="title-container">
                <img src="pip.png" alt="Pip" class="title-img" onerror="this.style.display='none'">
                <h1>波西和皮普</h1>
                <img src="posy.png" alt="Posy" class="title-img" onerror="this.style.display='none'">
            </div>
            <p>点屏幕让皮普飞起来<br>请选择今天的主题！</p>
            <div class="btn-grid">
                <button id="btnAnimal" class="btn-animal">🐶 动物篇</button>
                <button id="btnFruit" class="btn-fruit">🍎 水果篇</button>
                <button id="btnClothes" class="btn-clothes">🧢 衣服篇</button>
                <button id="btnObject" class="btn-object">⚽ 物品篇</button>
                <button id="btnVehicle" class="btn-vehicle">🚗 交通工具</button>
            </div>
        </div>

        <div id="sleepScreen" class="overlay hidden">
            <h1 style="font-size: 60px; margin-bottom: 10px;">👋</h1>
            <p style="color: #ecf0f1; font-size: 24px;">Time is up!<br>挥挥小手，说拜拜啦！</p>
            <button id="lockBtn" style="background:#555; color:#fff; border-color:#888; padding: 15px 40px;">再见 (熄灭屏幕)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        const groundHeight = 70; 

        function resizeCanvas() {
            const wrapper = document.getElementById('game-wrapper');
            const dpr = window.devicePixelRatio || 1;
            width = wrapper.clientWidth;
            height = wrapper.clientHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const GAME_TIME_MS = 5 * 60 * 1000; 
        let gameEndTime = 0;
        let gameState = 'start'; 
        let activeWordTimer = 0;
        let currentSessionVocab = []; 

        // 引入中文翻译的双语词库
        const vocabCategories = {
            animal: [
                { emoji: '🐶', word: 'Dog', zh: '小狗' }, { emoji: '🐱', word: 'Cat', zh: '小猫' },
                { emoji: '🐷', word: 'Pig', zh: '小猪' }, { emoji: '🐞', word: 'Bug', zh: '小虫' },
                { emoji: '🐝', word: 'Bee', zh: '蜜蜂' }, { emoji: '🐻', word: 'Bear', zh: '小熊' },
                { emoji: '🦆', word: 'Duck', zh: '鸭子' }, { emoji: '🦊', word: 'Fox', zh: '狐狸' }
            ],
            fruit: [
                { emoji: '🍎', word: 'Apple', zh: '苹果' }, { emoji: '🍌', word: 'Banana', zh: '香蕉' },
                { emoji: '🥝', word: 'Kiwi', zh: '猕猴桃' }, { emoji: '🍑', word: 'Peach', zh: '桃子' },
                { emoji: '🍐', word: 'Pear', zh: '梨子' }, { emoji: '🟣', word: 'Plum', zh: '李子' }
            ],
            clothes: [
                { emoji: '🧢', word: 'Hat', zh: '帽子' }, { emoji: '🧢', word: 'Cap', zh: '鸭舌帽' },
                { emoji: '👜', word: 'Bag', zh: '包包' }, { emoji: '🧥', word: 'Coat', zh: '外套' },
                { emoji: '👔', word: 'Tie', zh: '领带' }, { emoji: '👕', word: 'Top', zh: '上衣' }
            ],
            object: [
                { emoji: '🍵', word: 'Cup', zh: '杯子' }, { emoji: '📖', word: 'Book', zh: '书本' },
                { emoji: '⚽', word: 'Ball', zh: '皮球' }, { emoji: '🛏️', word: 'Bed', zh: '小床' },
                { emoji: '🧸', word: 'Toy', zh: '玩具' }, { emoji: '📦', word: 'Box', zh: '盒子' }
            ],
            vehicle: [
                { emoji: '🚗', word: 'Car', zh: '汽车' }, { emoji: '🚌', word: 'Bus', zh: '公交车' },
                { emoji: '🚐', word: 'Van', zh: '面包车' }, { emoji: '⛵', word: 'Boat', zh: '小船' },
                { emoji: '🚀', word: 'Jet', zh: '飞机' }, { emoji: '🚲', word: 'Bike', zh: '自行车' }
            ]
        };

        const pipImg = new Image(); pipImg.src = 'pip.png';
        let pipLoaded = false; pipImg.onload = () => { pipLoaded = true; };

        const posyImg = new Image(); posyImg.src = 'posy.png';
        let posyLoaded = false; posyImg.onload = () => { posyLoaded = true; };

        // 终极防哑火：静音状态标记
        let audioUnlocked = false;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function forceUnlockAudio() {
            if (audioUnlocked) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if ('speechSynthesis' in window) {
                // 播放一个无声音的空白符，强制手机分配音频通道
                let utter = new SpeechSynthesisUtterance('');
                utter.volume = 0;
                window.speechSynthesis.speak(utter);
            }
            audioUnlocked = true;
        }

        // 绑定到所有可能的全局触摸事件上
        document.addEventListener('touchstart', forceUnlockAudio, {once: true, passive: true});
        document.addEventListener('click', forceUnlockAudio, {once: true});

        function playTapSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playSuccessSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(660, audioCtx.currentTime);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        // 双语连续发音机制：移除 cancel() 避免 iOS 队列崩溃
        function speakWord(enText, zhText) {
            if (!window.speechSynthesis) return;

            // 英语发音
            const utterEn = new SpeechSynthesisUtterance(enText);
            utterEn.lang = 'en-US';
            utterEn.rate = 0.7; // 减速
            
            // 中文发音
            const utterZh = new SpeechSynthesisUtterance(zhText);
            utterZh.lang = 'zh-CN';
            utterZh.rate = 0.8; 

            // 按顺序推入系统队列
            window.speechSynthesis.speak(utterEn);
            window.speechSynthesis.speak(utterZh);
        }

        const pip = {
            x: 80, y: 300, baseHeight: 120,
            velocity: 0, gravity: 0.08, jumpForce: -4,    
            draw() {
                if (pipLoaded) {
                    const drawW = this.baseHeight * (pipImg.width / pipImg.height);
                    ctx.drawImage(pipImg, this.x - drawW/2, this.y - this.baseHeight/2, drawW, this.baseHeight);
                } else {
                    ctx.font = `80px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('🐰', this.x, this.y);
                }
            },
            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                if (this.y < this.baseHeight/2) {
                    this.y = this.baseHeight/2;
                    this.velocity = 1; 
                }
                if (this.y > height - groundHeight - this.baseHeight/2) {
                    this.y = height - groundHeight - this.baseHeight/2;
                    this.velocity = this.jumpForce * 0.8; 
                }
            }
        };

        const posy = {
            x: 60, baseHeight: 150,
            isCheering: false, cheerTimer: 0,
            draw(frameCount) {
                let base_Y = height - groundHeight - this.baseHeight/2; 
                if (this.isCheering) base_Y -= Math.abs(Math.sin(frameCount * 0.15) * 15);
                
                if (posyLoaded) {
                    const drawW = this.baseHeight * (posyImg.width / posyImg.height);
                    ctx.drawImage(posyImg, this.x - drawW/2, base_Y - this.baseHeight/2, drawW, this.baseHeight);
                } else {
                    ctx.font = `90px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('🐭', this.x, base_Y);
                }
            },
            cheer() {
                this.isCheering = true;
                clearTimeout(this.cheerTimer);
                this.cheerTimer = setTimeout(() => { this.isCheering = false; }, 2000);
            }
        };

        let items = [];
        function spawnItem() {
            const vocab = currentSessionVocab[Math.floor(Math.random() * currentSessionVocab.length)];
            items.push({
                x: width + 50,
                y: Math.random() * (height - 350) + 150, 
                vocab: vocab, size: 70, collected: false
            });
        }

        let clouds = [
            { x: 100, y: 150, speed: 0.4 },
            { x: 300, y: 90, speed: 0.2 },
            { x: 200, y: 250, speed: 0.5 }
        ];

        function drawBackground() {
            ctx.fillStyle = '#b5ead7'; ctx.fillRect(0, 0, width, height);
            ctx.font = '50px Arial';
            clouds.forEach(cloud => {
                ctx.fillText('☁️', cloud.x, cloud.y);
                cloud.x -= cloud.speed;
                if (cloud.x < -100) cloud.x = width + 50;
            });
            ctx.fillStyle = '#c7ceea'; ctx.fillRect(0, height - groundHeight, width, groundHeight);
        }

        let frameCount = 0;

        function gameLoop() {
            if (gameState !== 'playing') return;
            const timeLeft = gameEndTime - Date.now();
            if (timeLeft <= 0) { endGame(); return; }
            document.getElementById('timeBar').style.width = ((timeLeft / GAME_TIME_MS) * 100) + '%';
            
            ctx.clearRect(0, 0, width, height);
            drawBackground();
            pip.update(); pip.draw(); posy.draw(frameCount);

            frameCount++;
            if (frameCount % 200 === 0) spawnItem();

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.x -= width > 400 ? 2 : 1.5; 
                if (!item.collected) {
                    ctx.font = `${item.size}px Arial`;
                    ctx.fillText(item.vocab.emoji, item.x, item.y);
                    
                    if (Math.hypot(pip.x - item.x, pip.y - item.y) < 70) { 
                        item.collected = true;
                        triggerWordFeedback(item.vocab);
                    }
                }
                if (item.x < -100) items.splice(i, 1);
            }
            requestAnimationFrame(gameLoop);
        }

        function triggerWordFeedback(vocabObj) {
            playSuccessSound(); 
            speakWord(vocabObj.word, vocabObj.zh); // 双语发音
            posy.cheer(); 
            
            const wordEl = document.getElementById('wordDisplay');
            document.getElementById('textEn').innerText = vocabObj.word;
            document.getElementById('textZh').innerText = vocabObj.zh; // 同步显示中文
            
            wordEl.style.opacity = '1';
            clearTimeout(activeWordTimer);
            activeWordTimer = setTimeout(() => { wordEl.style.opacity = '0'; }, 3000); 
        }

        function startGame(categoryKey) {
            forceUnlockAudio(); 
            const fullList = [...vocabCategories[categoryKey]];
            fullList.sort(() => 0.5 - Math.random());
            currentSessionVocab = fullList.slice(0, 4); 
            
            speakWord("Let's go!", "开始吧"); 
            gameState = 'playing';
            gameEndTime = Date.now() + GAME_TIME_MS;
            items = []; pip.y = height / 2;
            document.getElementById('startScreen').classList.add('hidden');
            gameLoop();
        }

        function handleInput(e) {
            if (e.type === 'touchstart') e.preventDefault(); 
            if (gameState === 'playing') {
                pip.velocity = pip.jumpForce;
                playTapSound();
                
                // 触摸屏幕瞬间的强制碰撞检测（百分百触发手机发音）
                for (let i = items.length - 1; i >= 0; i--) {
                    let item = items[i];
                    if (!item.collected && Math.hypot(pip.x - item.x, pip.y - item.y) < 140) {
                        item.collected = true;
                        triggerWordFeedback(item.vocab);
                    }
                }
            }
        }

        canvas.addEventListener('touchstart', handleInput, { passive: false });
        canvas.addEventListener('mousedown', handleInput);

        ['Animal', 'Fruit', 'Clothes', 'Object', 'Vehicle'].forEach(key => {
            document.getElementById('btn' + key).addEventListener('click', (e) => {
                e.preventDefault();
                startGame(key.toLowerCase());
            });
        });

        document.getElementById('lockBtn').addEventListener('click', () => {
            document.getElementById('sleepScreen').innerHTML = '<h1 style="color:#555; font-size: 40px; margin-top:40vh;">See you next time! 👋</h1>';
        });
    </script>
</body>
</html>

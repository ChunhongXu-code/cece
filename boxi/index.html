<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>波西和皮普的英语派对</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background: #e2f0cb; 
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            font-family: 'Times New Roman', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background: #b5ead7; 
            overflow: hidden;
        }
        /* 取消了原本写死的宽高，改为100%填充，由JS接管高清渲染 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,246,233,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .hidden { display: none !important; }
        h1 { font-size: 36px; margin-bottom: 15px; color: #ff9aa2; }
        p { font-size: 20px; margin-bottom: 30px; color: #666; font-weight: bold; line-height: 1.5;}
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 250px;
        }
        button {
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            background: #ffdac1; 
            color: #555;
            border: 4px solid #fff;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.9); }
        .btn-animal { background: #ffb7b2; } /* 动物按钮颜色 */
        .btn-fruit { background: #e2f0cb; } /* 水果按钮颜色 */

        #timeBarContainer {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: 15px;
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
            z-index: 5;
            overflow: hidden;
        }
        #timeBar {
            width: 100%;
            height: 100%;
            background: #ffb7b2;
            transition: width 1s linear;
        }
        #wordDisplay {
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 70px;
            font-weight: bold;
            color: #ff9aa2;
            text-shadow: 4px 4px 0 #fff;
            z-index: 4;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #sleepScreen {
            background: #2c3e50;
            color: #ecf0f1;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="timeBarContainer"><div id="timeBar"></div></div>
        <div id="wordDisplay">Dog!</div>

        <div id="startScreen" class="overlay">
            <h1>🐰 波西和皮普 🐭</h1>
            <p>点屏幕让皮普飞起来<br>请选择今天的主题！</p>
            <div class="btn-group">
                <button class="btn-animal" onclick="startGame('animal')">🐶 动物园</button>
                <button class="btn-fruit" onclick="startGame('fruit')">🍎 水果园</button>
            </div>
        </div>

        <div id="sleepScreen" class="overlay hidden">
            <h1 style="font-size: 60px; margin-bottom: 10px;">👋</h1>
            <p style="color: #ecf0f1; font-size: 24px;">Time is up!<br>挥挥小手，说拜拜啦！</p>
            <button id="lockBtn" style="background:#555; color:#fff; border-color:#888;">再见 (熄灭屏幕)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // 【解决清晰度问题：Retina 高清屏适配】
        function resizeCanvas() {
            const wrapper = document.getElementById('game-wrapper');
            const dpr = window.devicePixelRatio || 1;
            width = wrapper.clientWidth;
            height = wrapper.clientHeight;
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const GAME_TIME_MS = 5 * 60 * 1000; // 5分钟
        let gameEndTime = 0;
        let gameState = 'start'; 
        let activeWordTimer = 0;
        let currentVocabList = []; // 当前选中的词库

        // 词库1：动物类
        const animalVocab = [
            { emoji: '🐶', word: 'Dog' },
            { emoji: '🐱', word: 'Cat' },
            { emoji: '🐷', word: 'Pig' },
            { emoji: '🐮', word: 'Cow' },
            { emoji: '🦆', word: 'Duck' },
            { emoji: '🐻', word: 'Bear' },
            { emoji: '🐦', word: 'Bird' },
            { emoji: '🐟', word: 'Fish' }
        ];

        // 词库2：水果类
        const fruitVocab = [
            { emoji: '🍎', word: 'Apple' },
            { emoji: '🍌', word: 'Banana' },
            { emoji: '🍑', word: 'Peach' },
            { emoji: '🍇', word: 'Grape' },
            { emoji: '🍐', word: 'Pear' },
            { emoji: '🍈', word: 'Melon' },
            { emoji: '🥝', word: 'Kiwi' }
        ];

        // 保持原有的等比图片加载
        const pipImg = new Image();
        pipImg.src = 'pip.png';
        let pipLoaded = false;
        pipImg.onload = () => { pipLoaded = true; };

        const posyImg = new Image();
        posyImg.src = 'posy.png';
        let posyLoaded = false;
        posyImg.onload = () => { posyLoaded = true; };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playTapSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.6;  
                utterance.pitch = 1.4; 
                window.speechSynthesis.speak(utterance);
            }
        }

        const pip = {
            x: 80,
            y: 300,
            baseHeight: 80, // 以高度为基准渲染，防止变扁
            velocity: 0,
            gravity: 0.15,    
            jumpForce: -5,   
            draw() {
                if (pipLoaded) {
                    // 【解决人物变扁问题：根据原始图片比例动态计算宽度】
                    const aspectRatio = pipImg.width / pipImg.height;
                    const drawW = this.baseHeight * aspectRatio;
                    const drawH = this.baseHeight;
                    ctx.drawImage(pipImg, this.x - drawW/2, this.y - drawH/2, drawW, drawH);
                } else {
                    ctx.font = `60px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🐰', this.x, this.y);
                }
            },
            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;
                if (this.y < this.baseHeight/2) {
                    this.y = this.baseHeight/2;
                    this.velocity = 1; 
                }
                if (this.y > height - 70 - this.baseHeight/2) {
                    this.y = height - 70 - this.baseHeight/2;
                    this.velocity = this.jumpForce * 0.8; 
                }
            },
            flap() {
                this.velocity = this.jumpForce;
                playTapSound();
            }
        };

        const posy = {
            x: 60,
            baseHeight: 70,
            isCheering: false,
            cheerTimer: 0,
            draw(frameCount) {
                let drawY = height - 50;
                if (this.isCheering) {
                    drawY -= Math.abs(Math.sin(frameCount * 0.15) * 15);
                }
                if (posyLoaded) {
                    // 同理，保持波西的图片比例
                    const aspectRatio = posyImg.width / posyImg.height;
                    const drawW = this.baseHeight * aspectRatio;
                    const drawH = this.baseHeight;
                    ctx.drawImage(posyImg, this.x - drawW/2, drawY - drawH/2, drawW, drawH);
                } else {
                    ctx.font = `55px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🐭', this.x, drawY);
                }
            },
            cheer() {
                this.isCheering = true;
                clearTimeout(this.cheerTimer);
                this.cheerTimer = setTimeout(() => {
                    this.isCheering = false;
                }, 2000);
            }
        };

        let items = [];
        function spawnItem() {
            const vocab = currentVocabList[Math.floor(Math.random() * currentVocabList.length)];
            items.push({
                x: width + 50,
                y: Math.random() * (height - 250) + 100,
                vocab: vocab,
                size: 60,
                collected: false
            });
        }

        let clouds = [
            { x: 100, y: 150, speed: 0.4 },
            { x: 300, y: 90, speed: 0.2 },
            { x: 200, y: 250, speed: 0.5 }
        ];

        function drawBackground() {
            ctx.fillStyle = '#b5ead7';
            ctx.fillRect(0, 0, width, height);
            ctx.font = '50px Arial';
            clouds.forEach(cloud => {
                ctx.fillText('☁️', cloud.x, cloud.y);
                cloud.x -= cloud.speed;
                if (cloud.x < -100) cloud.x = width + 50;
            });
            ctx.fillStyle = '#c7ceea'; 
            ctx.fillRect(0, height - 70, width, 70);
        }

        let frameCount = 0;

        function gameLoop() {
            if (gameState !== 'playing') return;

            const timeLeft = gameEndTime - Date.now();
            if (timeLeft <= 0) {
                endGame();
                return;
            }
            const percent = (timeLeft / GAME_TIME_MS) * 100;
            document.getElementById('timeBar').style.width = percent + '%';

            ctx.clearRect(0, 0, width, height);
            drawBackground();

            pip.update();
            pip.draw();
            posy.draw(frameCount);

            frameCount++;
            if (frameCount % 200 === 0) { 
                spawnItem();
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.x -= width > 400 ? 2 : 1.5; // 根据屏幕宽度微调移动速度
                
                if (!item.collected) {
                    ctx.font = `${item.size}px Arial`;
                    ctx.fillText(item.vocab.emoji, item.x, item.y);

                    const dist = Math.hypot(pip.x - item.x, pip.y - item.y);
                    if (dist < 65) {
                        item.collected = true;
                        triggerWordFeedback(item.vocab.word);
                    }
                }

                if (item.x < -100) {
                    items.splice(i, 1);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function triggerWordFeedback(word) {
            speakWord(word);
            posy.cheer(); 
            const wordEl = document.getElementById('wordDisplay');
            wordEl.innerText = word;
            wordEl.style.opacity = '1';
            clearTimeout(activeWordTimer);
            activeWordTimer = setTimeout(() => {
                wordEl.style.opacity = '0';
            }, 2500); 
        }

        window.startGame = function(category) {
            initAudio(); 
            // 根据用户点击的按钮分配词库
            currentVocabList = category === 'animal' ? animalVocab : fruitVocab;
            
            speakWord("Let's go!"); 
            gameState = 'playing';
            gameEndTime = Date.now() + GAME_TIME_MS;
            items = [];
            pip.y = height / 2;
            document.getElementById('startScreen').classList.add('hidden');
            gameLoop();
        };

        function endGame() {
            gameState = 'sleep';
            document.getElementById('sleepScreen').classList.remove('hidden');
            speakWord("Bye-bye, see you next time!");
        }

        function handleInput(e) {
            if (e.type === 'touchstart') e.preventDefault(); 
            if (gameState === 'playing') {
                pip.flap();
            }
        }

        canvas.addEventListener('touchstart', handleInput, { passive: false });
        canvas.addEventListener('mousedown', handleInput);

        document.getElementById('lockBtn').addEventListener('click', () => {
            document.getElementById('sleepScreen').innerHTML = '<h1 style="color:#555; font-size: 40px; margin-top:40vh;">See you next time! 👋</h1>';
        });
    </script>
</body>
</html>

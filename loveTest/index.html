* {

}

:root {

.container {

}

  border-radius: 24px;

  align-items: center;
  justify-content: center;
  font-size: 42px;

}

}

.main-title {

}

.subtitle {

.info-cards {

.info-card {

.feature-list li {

.feature-list li:before {

}

.btn-start {

  color: white;
  border: none;
  border-radius: 16px;
  font-size: 18px;
  font-weight: 700;

  box-shadow: var(--shadow);

  position: relative;
  overflow: hidden;
}

.btn-start:before {
  content: '';

  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

.btn-start:active:before {
  width: 300px;
  height: 300px;
}

.btn-start:active {

}

.note {

  font-size: 12px;
  color: var(--text-light);
}

.progress-bar {

}

.progress-track {

  border-radius: 10px;

}

.progress-fill {

  }

}

.q-text {

  color: var(--text-dark);

.options {

  flex-direction: column;
  gap: 10px;
}

.option-btn {
  width: 100%;
  padding: 16px;
  background: #f8f5fc;
  border: 2px solid transparent;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.5;
  text-align: left;

  color: var(--text-dark);

}

.option-btn:hover {

.option-btn.selected {

  color: var(--primary);

}

.option-btn.selected:after {
  content: '✓';

  font-size: 20px;

}

.nav-area {

  justify-content: flex-start;
  margin-top: 16px;

.btn-back {

.btn-back:active {

.result-header {

.result-emoji {

.result-type {

  background-clip: text;

}

.result-subtitle {
  font-size: 14px;

}

.result-score {

.result-desc {

}

.result-desc .highlight {

.result-desc .quote {

.multi-types {
  display: flex;

  gap: 12px;
  margin-bottom: 16px;
}

.multi-card {
  background: var(--card-bg);

  border-radius: 20px;

}

.multi-card-title {
  font-size: 18px;

  color: var(--text-dark);

}

.multi-card-sub {

}

.spectrum-card {

}

.spectrum-item {

.spectrum-label {

.spectrum-label-name {

.spectrum-bar {

.compat-card {

.compat-item {

.compat-item.good {

.compat-item-label {

.share-card {

.btn-share {

.btn-retry {

/* 响应式优化 */
@media (max-width: 400px) {

// ===== 核心逻辑 =====
let shuffledQ = [];
let current = 0;
let answers = [];

function shuffle(arr) {
  const res = [...arr];
  for(let i = res.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [res[i], res[j]] = [res[j], res[i]];
  }
  return res;
}

function startQuiz() {
  shuffledQ = shuffle(QS).map(q => ({
    ...q,
    opts: shuffle(q.opts)
  }));
  
  current = 0;
  answers = new Array(shuffledQ.length).fill(null);
  
  document.getElementById('cover').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  
  renderQuestion();
  window.scrollTo(0, 0);
}

function renderQuestion() {
  const q = shuffledQ[current];
  const total = shuffledQ.length;
  const completed = answers.filter(Boolean).length;
  const pct = Math.round((completed / total) * 100);
  
  document.getElementById('prog-label').textContent = `第 ${current + 1} 题`;
  document.getElementById('prog-pct').textContent = `${pct}%`;
  document.getElementById('prog-fill').style.width = `${pct}%`;
  
  let html = `<div class="question-card">`;
  html += `<div class="q-num">问题 ${current + 1} / ${total}</div>`;
  
  if(q.ctx) {
    html += `<div class="q-context">${q.ctx}</div>`;
  }
  
  html += `<div class="q-text">${q.text}</div>`;
  html += `<div class="options">`;
  
  q.opts.forEach((opt, i) => {
    const selected = answers[current] && answers[current].k === opt.k;
    html += `
      <button 
        class="option-btn ${selected ? 'selected' : ''}"
        onclick="choose(${i})"
      >
        ${opt.t}
      </button>
    `;
  });
  
  html += `</div>`;
  
  if(current > 0) {
    html += `
      <div class="nav-area">
        <button class="btn-back" onclick="goBack()">← 上一题</button>
      </div>
    `;
  }
  
  html += `</div>`;
  
  document.getElementById('q-area').innerHTML = html;
}

function choose(idx) {
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.style.pointerEvents = 'none');
  btns[idx].classList.add('selected');
  
  const selected = shuffledQ[current].opts[idx];
  answers[current] = { k: selected.k, t: selected.t };
  
  setTimeout(() => {
    current++;
    if(current < shuffledQ.length) {
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      showResult();
    }
  }, 300);
}

function goBack() {
  if(current <= 0) return;
  current--;
  answers[current] = null;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function calculateScores() {
  const scores = { A:0, B:0, C:0, D:0, E:0, F:0, G:0 };
  answers.forEach(ans => {
    if(ans && scores[ans.k] !== undefined) {
      scores[ans.k]++;
    }
  });
  return scores;
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  
  const scores = calculateScores();
  const sorted = Object.entries(scores).sort((a,b) => {
    if(b[1] !== a[1]) return b[1] - a[1];
    return a[0].localeCompare(b[0]);
  });
  
  const topScore = sorted[0][1];
  const leaders = sorted.filter(([,s]) => s === topScore).map(([k]) => k);
  
  const mainKey = leaders[0];
  const mainType = TYPES[mainKey];
  
  let html = `<div class="result-header">`;
  html += `<div class="result-emoji">${mainType.emoji}</div>`;
  
  if(leaders.length === 1) {
    html += `<div class="result-type">${mainType.name}</div>`;
    html += `<div class="result-subtitle">${mainType.short}</div>`;
  } else if(leaders.length === 2) {
    const t1 = TYPES[leaders[0]];
    const t2 = TYPES[leaders[1]];
    html += `<div class="result-type">${t1.name.replace('型','')} × ${t2.name}</div>`;
    html += `<div class="result-subtitle">双主型人格</div>`;
  } else {
    html += `<div class="result-type">多重混合恋爱型</div>`;
    html += `<div class="result-subtitle">${leaders.length} 种类型并列</div>`;
  }
  
  html += `<div class="result-score">最高分：${topScore} / 16</div>`;
  html += `</div>`;
  
  if(leaders.length > 1) {
    html += `
      <div class="tie-notice">
        💡 你有 ${leaders.length} 个类型并列最高分。
        这表明你的恋爱状态具有较强的情境适应性，
        会根据关系阶段和对象特征表现出不同倾向。
      </div>
    `;
  }
  
  if(leaders.length === 1) {
    html += `<div class="result-desc">${mainType.desc}</div>`;
  } else {
    html += `<div class="multi-types">`;
    leaders.forEach(k => {
      const t = TYPES[k];
      html += `
        <div class="multi-card">
          <div class="multi-card-title">${t.emoji} ${t.name}</div>
          <div class="multi-card-sub">${t.short}</div>
          <div class="multi-card-text">${t.summary}</div>
        </div>
      `;
    });
    html += `</div>`;
  }
  
  // 光谱
  html += `<div class="spectrum-card">`;
  html += `<div class="spectrum-title">📊 你的恋爱状态光谱</div>`;
  html += `<div class="spectrum-note">每种类型理论最高16分</div>`;
  
  sorted.forEach(([k, v]) => {
    const pct = Math.round((v / 16) * 100);
    const isTop = leaders.includes(k);
    html += `
      <div class="spectrum-item">
        <div class="spectrum-label">
          <span class="spectrum-label-name">${TYPES[k].emoji} ${TYPES[k].name.replace('型','')}</span>
          <span class="spectrum-label-value">${v} / 16</span>
        </div>
        <div class="spectrum-bar">
          <div class="spectrum-bar-fill ${isTop ? 'top' : ''}" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  });
  
  html += `</div>`;
  
  // 兼容性
  if(leaders.length === 1) {
    html += `
      <div class="compat-card">
        <div class="compat-title">💞 关系兼容性参考</div>
        <div class="compat-row">
          <div class="compat-item good">
            <div class="compat-item-label">可能互补</div>
            ${mainType.good}
          </div>
          <div class="compat-item caution">
            <div class="compat-item-label">需要沟通</div>
            ${mainType.caution}
          </div>
        </div>
      </div>
    `;
  }
  
  // 分享
  const typeName = leaders.length === 1 
    ? mainType.name
    : leaders.length === 2
      ? `${TYPES[leaders[0]].name.replace('型','')}×${TYPES[leaders[1]].name}`
      : '多重混合恋爱型';
  
  html += `
    <div class="share-card">
      <div class="share-title">💕 分享你的恋爱人格</div>
      <div class="share-text">
        生成专属结果卡片<br>
        分享到朋友圈 / 小红书 / 微信好友
      </div>
      <button class="btn-share" onclick="saveImage()">
        📸 保存分享卡片
      </button>
    </div>
  `;
  
  html += `<button class="btn-retry" onclick="retry()">🔄 重新测试</button>`;
  
  document.getElementById('result').innerHTML = html;
  document.getElementById('result').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function retry() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('cover').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== 分享卡片生成 =====
function saveImage() {
  const scores = calculateScores();
  const sorted = Object.entries(scores).sort((a,b) => {
    if(b[1] !== a[1]) return b[1] - a[1];
    return a[0].localeCompare(b[0]);
  });
  
  const topScore = sorted[0][1];
  const leaders = sorted.filter(([,s]) => s === topScore).map(([k]) => k);
  
  drawCard(leaders, sorted, topScore);
}

function drawCard(leaders, sorted, topScore) {
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  
  const W = 750;  // 适合朋友圈的宽度
  const H = 1334; // 16:9 竖版
  
  canvas.width = W;
  canvas.height = H;
  
  // 渐变背景
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#fff5f7');
  grad.addColorStop(1, '#fef3ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // 装饰圆点
  ctx.fillStyle = 'rgba(255, 107, 157, 0.08)';
  for(let i = 0; i < 15; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = 20 + Math.random() * 60;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  
  let y = 80;
  
  // Logo
  const logoGrad = ctx.createLinearGradient(0, y, 0, y + 120);
  logoGrad.addColorStop(0, '#ff6b9d');
  logoGrad.addColorStop(1, '#a78bfa');
  ctx.fillStyle = logoGrad;
  ctx.fillRect(W/2 - 60, y, 120, 120);
  ctx.fillStyle = 'white';
  ctx.font = 'bold 72px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('💕', W/2, y + 88);
  
  y += 160;
  
  // 标题
  ctx.fillStyle = '#2d1b3d';
  ctx.font = 'bold 48px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('恋爱状态鉴定', W/2, y);
  
  y += 80;
  
  // 类型卡片
  ctx.fillStyle = 'white';
  roundRect(ctx, 50, y, W - 100, 280, 24);
  ctx.fill();
  
  // 阴影
  ctx.shadowColor = 'rgba(167, 139, 250, 0.2)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 10;
  roundRect(ctx, 50, y, W - 100, 280, 24);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  
  const mainType = TYPES[leaders[0]];
  
  // Emoji
  ctx.font = 'bold 80px Arial';
  ctx.fillText(mainType.emoji, W/2, y + 90);
  
  // 类型名
  ctx.fillStyle = '#2d1b3d';
  ctx.font = 'bold 42px "Noto Sans SC", sans-serif';
  
  let typeName = '';
  if(leaders.length === 1) {
    typeName = mainType.name;
  } else if(leaders.length === 2) {
    typeName = `${TYPES[leaders[0]].name.replace('型','')} × ${TYPES[leaders[1]].name}`;
  } else {
    typeName = '多重混合恋爱型';
  }
  
  ctx.fillText(typeName, W/2, y + 160);
  
  // 副标题
  ctx.fillStyle = '#6b5b7a';
  ctx.font = '400 24px "Noto Sans SC", sans-serif';
  
  if(leaders.length === 1) {
    ctx.fillText(mainType.short, W/2, y + 200);
  } else {
    ctx.fillText(`${leaders.length} 种类型并列`, W/2, y + 200);
  }
  
  // 得分
  const scoreGrad = ctx.createLinearGradient(0, y + 220, 0, y + 260);
  scoreGrad.addColorStop(0, '#ffe8f0');
  scoreGrad.addColorStop(1, '#f3e8ff');
  ctx.fillStyle = scoreGrad;
  roundRect(ctx, W/2 - 100, y + 220, 200, 48, 24);
  ctx.fill();
  
  ctx.fillStyle = '#ff6b9d';
  ctx.font = 'bold 24px "Noto Sans SC", sans-serif';
  ctx.fillText(`最高分：${topScore} / 16`, W/2, y + 252);
  
  y += 320;
  
  // 光谱区域
  ctx.fillStyle = 'white';
  roundRect(ctx, 50, y, W - 100, 420, 24);
  ctx.fill();
  
  ctx.fillStyle = '#2d1b3d';
  ctx.font = 'bold 28px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('📊 恋爱状态光谱', 80, y + 50);
  
  let barY = y + 90;
  
  sorted.slice(0, 5).forEach(([k, v]) => {
    const t = TYPES[k];
    const isTop = leaders.includes(k);
    
    ctx.fillStyle = '#2d1b3d';
    ctx.font = `${isTop ? 'bold' : '400'} 22px "Noto Sans SC", sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(`${t.emoji} ${t.name.replace('型','')}`, 80, barY + 20);
    
    ctx.fillStyle = '#9d8baa';
    ctx.font = '400 20px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(`${v}/16`, W - 80, barY + 20);
    
    // 进度条
    const barW = W - 160;
    const fillW = Math.max(10, (v / 16) * barW);
    
    ctx.fillStyle = '#f0e6f6';
    roundRect(ctx, 80, barY + 30, barW, 10, 5);
    ctx.fill();
    
    if(isTop) {
      const barGrad = ctx.createLinearGradient(80, barY + 30, 80 + fillW, barY + 30);
      barGrad.addColorStop(0, '#ff6b9d');
      barGrad.addColorStop(1, '#a78bfa');
      ctx.fillStyle = barGrad;
    } else {
      ctx.fillStyle = '#d8b4fe';
    }
    
    roundRect(ctx, 80, barY + 30, fillW, 10, 5);
    ctx.fill();
    
    barY += 65;
  });
  
  y += 460;
  
  // 底部信息
  ctx.fillStyle = '#9d8baa';
  ctx.font = '400 20px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('长按保存 · 分享给好友', W/2, y);
  
  y += 40;
  ctx.fillText('28道等权题目 · 无套路 · 仅供娱乐', W/2, y);
  
  // 下载
  const link = document.createElement('a');
  link.download = `恋爱状态_${typeName}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

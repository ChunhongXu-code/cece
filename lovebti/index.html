.option-btn.selected {

// 全局变量
let currentQ = 0;
let answers = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
let history = [];

function startQuiz() {
  currentQ = 0;
  answers = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
  history = [];
  
  document.getElementById('cover').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const total = QUESTIONS.length;
  const progress = Math.round((currentQ / total) * 100);
  
  document.getElementById('prog-label').textContent = `第 ${currentQ + 1} 题`;
  document.getElementById('prog-pct').textContent = `${progress}%`;
  document.getElementById('prog-fill').style.width = `${progress}%`;
  
  const q = QUESTIONS[currentQ];
  
  let html = `
    <div class="question-card">
      <div class="q-num">问题 ${currentQ + 1} / ${total}</div>
      <div class="q-text">${q.text}</div>
      <div class="options">
  `;
  
  q.options.forEach((opt, i) => {
    html += `
      <button class="option-btn" onclick="choose(${i})">
        ${opt.text}
      </button>
    `;
  });
  
  html += `</div>`;
  
  if (currentQ > 0) {
    html += `
      <div class="nav-area">
        <button class="btn-back" onclick="goBack()">← 上一题</button>
      </div>
    `;
  }
  
  html += `</div>`;
  
  document.getElementById('q-area').innerHTML = html;
}

function choose(idx) {
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.style.pointerEvents = 'none');
  btns[idx].classList.add('selected');
  
  const q = QUESTIONS[currentQ];
  const selected = q.options[idx];
  
  history.push({ ...answers });
  answers[selected.dim]++;
  
  setTimeout(() => {
    currentQ++;
    if (currentQ < QUESTIONS.length) {
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      showResult();
    }
  }, 300);
}

function goBack() {
  if (currentQ > 0 && history.length > 0) {
    currentQ--;
    answers = history.pop();
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';

function saveImage() {
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  
  const type = 
    (answers.E >= answers.I ? 'E' : 'I') +
    (answers.S >= answers.N ? 'S' : 'N') +
    (answers.T >= answers.F ? 'T' : 'F') +
    (answers.J >= answers.P ? 'J' : 'P');
  
  const personality = PERSONALITIES[type];
  
  const W = 750;
  const H = 1334;
  canvas.width = W;
  canvas.height = H;
  
  // 背景渐变
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#fff5f7');
  grad.addColorStop(1, '#fef3ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // 装饰圆点
  ctx.fillStyle = 'rgba(255, 107, 157, 0.08)';
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = 20 + Math.random() * 60;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  
  let y = 100;
  
  // Emoji
  ctx.font = 'bold 120px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(personality.emoji, W/2, y);
  
  y += 140;
  
  // 类型名称
  ctx.fillStyle = '#2d1b3d';
  ctx.font = 'bold 56px "Noto Sans SC", sans-serif';
  ctx.fillText(personality.name, W/2, y);
  
  y += 70;
  
  // 副标题
  ctx.fillStyle = '#6b5b7a';
  ctx.font = '400 28px "Noto Sans SC", sans-serif';
  ctx.fillText(personality.subtitle, W/2, y);
  
  y += 90;
  
  // 关键词标签
  const tags = personality.keywords;
  const tagY = y;
  const tagSpacing = 20;
  const tagHeight = 50;
  
  // 简单排列标签（两行）
  const row1 = tags.slice(0, 2);
  const row2 = tags.slice(2, 4);
  
  [row1, row2].forEach((rowTags, rowIdx) => {
    const totalWidth = rowTags.length * 160 + (rowTags.length - 1) * tagSpacing;
    let x = (W - totalWidth) / 2;
    const currentY = tagY + rowIdx * (tagHeight + tagSpacing);
    
    rowTags.forEach(tag => {
      // 标签背景
      const tagGrad = ctx.createLinearGradient(x, currentY, x + 160, currentY + tagHeight);
      tagGrad.addColorStop(0, '#ffe8f0');
      tagGrad.addColorStop(1, '#f3e8ff');
      ctx.fillStyle = tagGrad;
      roundRect(ctx, x, currentY, 160, tagHeight, 25);
      ctx.fill();
      
      // 标签文字
      ctx.fillStyle = '#ff6b9d';
      ctx.font = 'bold 20px "Noto Sans SC", sans-serif';
      ctx.fillText(tag, x + 80, currentY + 32);
      
      x += 160 + tagSpacing;
    });
  });
  
  y += 140;
  
  // 白色卡片
  ctx.fillStyle = 'white';
  roundRect(ctx, 50, y, W - 100, 450, 24);
  ctx.shadowColor = 'rgba(167, 139, 250, 0.2)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 10;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  
  y += 50;
  
  // 恋爱风格
  ctx.fillStyle = '#2d1b3d';
  ctx.font = 'bold 26px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('💕 你的恋爱风格', 80, y);
  
  y += 50;
  
  // 多行文本
  ctx.fillStyle = '#6b5b7a';
  ctx.font = '400 22px "Noto Sans SC", sans-serif';
  wrapText(ctx, personality.loveStyle, 80, y, W - 160, 36);
  
  y += 200;
  
  // 最佳CP
  ctx.fillStyle = '#2d1b3d';
  ctx.font = 'bold 26px "Noto Sans SC", sans-serif';
  ctx.fillText('💑 最佳CP', 80, y);
  
  y += 50;
  
  ctx.fillStyle = '#047857';
  ctx.font = 'bold 24px "Noto Sans SC", sans-serif';
  ctx.fillText(personality.bestMatch.type, 80, y);
  
  y += 40;
  
  ctx.fillStyle = '#10b981';
  ctx.font = '400 20px "Noto Sans SC", sans-serif';
  wrapText(ctx, personality.bestMatch.reason, 80, y, W - 160, 32);
  
  y += 160;
  
  // 底部信息
  ctx.fillStyle = '#9d8baa';
  ctx.font = '400 20px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('恋爱16型人格测试 · 长按保存分享', W/2, y);
  
  y += 40;
  ctx.fillText('温柔吐槽 · 价值观正 · 仅供娱乐', W/2, y);
  
  // 下载
  const link = document.createElement('a');
  link.download = `恋爱人格_${personality.name}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split('');
  let line = '';
  let currentY = y;
  
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n];
    const metrics = ctx.measureText(testLine);
    
    if (metrics.width > maxWidth && n > 0) {
      ctx.fillText(line, x, currentY);
      line = words[n];
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, currentY);
}

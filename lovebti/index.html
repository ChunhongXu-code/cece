* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --primary: #4a90e2;
  --primary-dark: #2e5c8a;
  --accent: #f5a623;
  
  --bg: #f8f9fa;
  --card: #ffffff;
  --border: #e1e4e8;
  
  --text-dark: #24292e;
  --text-medium: #586069;
  --text-light: #6a737d;
  
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.1);
}

body {
  min-height: 100vh;
  background: var(--bg);
  font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
  color: var(--text-dark);
  line-height: 1.6;
  padding-bottom: 40px;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 20px 16px;
}

/* ===== 封面 ===== */
#cover {
  text-align: center;
}

.logo {
  width: 64px;
  height: 64px;
  margin: 24px auto 20px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  box-shadow: var(--shadow);
}

.main-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-dark);
  margin: 16px 0 8px;
  line-height: 1.3;
}

.subtitle {
  font-size: 15px;
  color: var(--text-medium);
  margin-bottom: 24px;
  line-height: 1.5;
}

.info-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.info-card {
  background: var(--card);
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

.info-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 4px;
}

.info-label {
  font-size: 12px;
  color: var(--text-light);
  font-weight: 500;
}

.feature-box {
  background: var(--card);
  padding: 20px;
  border-radius: 12px;
  border: 1px solid var(--border);
  margin-bottom: 24px;
  text-align: left;
}

.feature-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 12px;
}

.feature-list {
  list-style: none;
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-medium);
}

.feature-list li {
  padding-left: 20px;
  position: relative;
}

.feature-list li:before {
  content: '•';
  position: absolute;
  left: 6px;
  color: var(--primary);
  font-weight: 700;
}

.btn-start {
  width: 100%;
  padding: 16px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.2s ease;
}

.btn-start:active {
  transform: translateY(1px);
  box-shadow: none;
}

.note {
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-light);
}

/* ===== 答题 ===== */
#quiz {
  display: none;
}

.progress-bar {
  background: var(--card);
  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  margin-bottom: 20px;
  position: sticky;
  top: 16px;
  z-index: 100;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--text-medium);
}

.progress-info-left {
  font-weight: 600;
  color: var(--text-dark);
}

.progress-track {
  height: 6px;
  background: var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 10px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.question-card {
  background: var(--card);
  padding: 24px 20px;
  border-radius: 12px;
  border: 1px solid var(--border);
  margin-bottom: 16px;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.q-num {
  display: inline-block;
  padding: 4px 10px;
  background: #f0f4f8;
  color: var(--text-medium);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 16px;
}

.q-text {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 20px;
  color: var(--text-dark);
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  width: 100%;
  padding: 16px;
  background: #f6f8fa;
  border: 2px solid transparent;
  border-radius: 10px;
  font-size: 15px;
  line-height: 1.5;
  text-align: left;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--text-dark);
  font-weight: 500;
}

.option-btn:active {
  transform: scale(0.98);
}

.option-btn:hover {
  background: #e8eef3;
  border-color: var(--primary);
}

.option-btn.selected {
  background: #e3f2fd;
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 600;
}

.nav-area {
  display: flex;
  justify-content: flex-start;
  margin-top: 16px;
}

.btn-back {
  padding: 10px 18px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-medium);
  cursor: pointer;
  font-weight: 500;
  transition: all 0.2s ease;
}

.btn-back:active {
  transform: scale(0.95);
}

/* ===== 结果 ===== */
#result {
  display: none;
}

.result-header {
  background: var(--card);

  border: 1px solid var(--border);
  margin-bottom: 16px;
  text-align: center;

.result-emoji {

  margin-bottom: 16px;
}

.result-type {

  font-weight: 700;
  color: var(--text-dark);

.result-code {

  color: var(--text-medium);
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;

.result-subtitle {

  color: var(--text-medium);
  margin-bottom: 16px;
}

.result-tags {

  background: #f0f4f8;

  font-size: 12px;
  font-weight: 600;
  color: var(--text-dark);

.result-card {

.card-title {

.trait-list li:last-child {

}

.trait-list li:before {
  content: '·';
  position: absolute;
  left: 8px;
  color: var(--primary);
  font-size: 20px;
  font-weight: 700;
}

.match-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 14px 0;

.match-card {
  padding: 16px;

@media (max-width: 400px) {

</style>
</head>

      { text: '提前计划好时间、地点、行程', dim: 'J' },
      { text: '临时决定，看当天心情', dim: 'P' }
    ]
  },
  {
    text: '对方突然说"我们出去玩吧"：',
    options: [
      { text: '"去哪？几点？我安排一下"', dim: 'J' },
      { text: '"好啊！走吧！"（什么都没准备）', dim: 'P' }
    ]
  },
  {
    text: '你更喜欢的生活方式：',
    options: [
      { text: '规律稳定，有计划', dim: 'J' },
      { text: '自由随性，有惊喜', dim: 'P' }
    ]
  },
  {
    text: '对于"结婚计划"：',
    options: [
      { text: '早就想好了，就等合适的人', dim: 'J' },
      { text: '还没想过，遇到了再说', dim: 'P' }
    ]
  },
  {
    text: '你更能接受：',
    options: [
      { text: '按部就班的恋爱节奏', dim: 'J' },
      { text: '充满变数的恋爱体验', dim: 'P' }
    ]
  },
  {
    text: '你的纪念日风格：',
    options: [
      { text: '提前准备，绝不会忘', dim: 'J' },
      { text: '想起来就过，忘了就补', dim: 'P' }
    ]
  },
  {
    text: '你更欣赏的伴侣是：',
    options: [
      { text: '有计划、有目标、靠谱', dim: 'J' },
      { text: '随性、有趣、充满惊喜', dim: 'P' }
    ]
  }
];

// 全局变量
let currentQ = 0;
let answers = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
let history = [];

function startQuiz() {
  currentQ = 0;
  answers = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
  history = [];
  
  document.getElementById('cover').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const total = QUESTIONS.length;
  const progress = Math.round((currentQ / total) * 100);
  
  document.getElementById('prog-label').textContent = `第 ${currentQ + 1} 题`;
  document.getElementById('prog-pct').textContent = `${progress}%`;
  document.getElementById('prog-fill').style.width = `${progress}%`;
  
  const q = QUESTIONS[currentQ];
  
  let html = `
    <div class="question-card">
      <div class="q-num">问题 ${currentQ + 1} / ${total}</div>
      <div class="q-text">${q.text}</div>
      <div class="options">
  `;
  
  q.options.forEach((opt, i) => {
    html += `
      <button class="option-btn" onclick="choose(${i})">
        ${opt.text}
      </button>
    `;
  });
  
  html += `</div>`;
  
  if (currentQ > 0) {
    html += `
      <div class="nav-area">
        <button class="btn-back" onclick="goBack()">← 上一题</button>
      </div>
    `;
  }
  
  html += `</div>`;
  
  document.getElementById('q-area').innerHTML = html;
}

function choose(idx) {
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.style.pointerEvents = 'none');
  btns[idx].classList.add('selected');
  
  const q = QUESTIONS[currentQ];
  const selected = q.options[idx];
  
  history.push({ ...answers });
  answers[selected.dim]++;
  
  setTimeout(() => {
    currentQ++;
    if (currentQ < QUESTIONS.length) {
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      showResult();
    }
  }, 300);
}

function goBack() {
  if (currentQ > 0 && history.length > 0) {
    currentQ--;
    answers = history.pop();
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  
  const type = 
    (answers.E >= answers.I ? 'E' : 'I') +
    (answers.S >= answers.N ? 'S' : 'N') +
    (answers.T >= answers.F ? 'T' : 'F') +
    (answers.J >= answers.P ? 'J' : 'P');
  
  const personality = PERSONALITIES[type];
  
  const html = `
    <div class="result-header">
      <div class="result-emoji">${personality.emoji}</div>
      <div class="result-type">${personality.name}</div>
      <div class="result-code">${type}</div>
      <div class="result-subtitle">${personality.subtitle}</div>
      <div class="result-tags">
        ${personality.keywords.map(k => `<span class="tag">${k}</span>`).join('')}
      </div>
    </div>
    
    <div class="result-card">
      <div class="card-title">性格特征</div>
      <div class="result-text">${personality.description}</div>
    </div>
    
    <div class="result-card">
      <div class="card-title">优势</div>
      <ul class="trait-list">
        ${personality.strengths.map(s => `<li>${s}</li>`).join('')}
      </ul>
    </div>
    
    <div class="result-card">
      <div class="card-title">需要注意</div>
      <ul class="trait-list">
        ${personality.weaknesses.map(w => `<li>${w}</li>`).join('')}
      </ul>
    </div>
    
    <div class="result-card">
      <div class="card-title">恋爱风格</div>
      <div class="result-text">${personality.loveStyle}</div>
    </div>
    
    <div class="result-card">
      <div class="card-title">关系匹配</div>
      <div class="match-grid">
        <div class="match-card good">
          <div class="match-label">建议搭配</div>
          <div class="match-type">${personality.bestMatch.type}</div>
          <div class="match-desc">${personality.bestMatch.reason}</div>
        </div>
        <div class="match-card avoid">
          <div class="match-label">谨慎考虑</div>
          <div class="match-type">${personality.avoid.type}</div>
          <div class="match-desc">${personality.avoid.reason}</div>
        </div>
      </div>
    </div>
    
    <div class="result-card">
      <div class="card-title">建议</div>
      <div class="quote-box">${personality.advice}</div>
    </div>
    
    <div class="share-card">
      <div class="share-title">分享你的测试结果</div>
      <div class="share-text">
        生成结果卡片，分享给朋友
      </div>
      <button class="btn-share" onclick="saveImage()">
        保存分享卡片
      </button>
    </div>
    
    <button class="btn-retry" onclick="retry()">
      重新测试
    </button>
  `;
  
  document.getElementById('result').innerHTML = html;
  document.getElementById('result').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function retry() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('cover').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function saveImage() {
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  
  const type = 
    (answers.E >= answers.I ? 'E' : 'I') +
    (answers.S >= answers.N ? 'S' : 'N') +
    (answers.T >= answers.F ? 'T' : 'F') +
    (answers.J >= answers.P ? 'J' : 'P');
  
  const personality = PERSONALITIES[type];
  
  const W = 750;
  const H = 1334;
  canvas.width = W;
  canvas.height = H;
  
  // 简洁背景
  ctx.fillStyle = '#f8f9fa';
  ctx.fillRect(0, 0, W, H);
  
  let y = 100;
  
  // Emoji
  ctx.font = 'bold 100px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(personality.emoji, W/2, y);
  
  y += 120;
  
  // 类型名称
  ctx.fillStyle = '#24292e';
  ctx.font = 'bold 52px "Noto Sans SC", sans-serif';
  ctx.fillText(personality.name, W/2, y);
  
  y += 60;
  
  // 类型代码
  ctx.fillStyle = '#586069';
  ctx.font = '400 32px Inter, sans-serif';
  ctx.fillText(type, W/2, y);
  
  y += 80;
  
  // 副标题
  ctx.fillStyle = '#6a737d';
  ctx.font = '400 26px "Noto Sans SC", sans-serif';
  ctx.fillText(personality.subtitle, W/2, y);
  
  y += 100;
  
  // 白色卡片
  ctx.fillStyle = 'white';
  roundRect(ctx, 50, y, W - 100, 500, 16);
  ctx.shadowColor = 'rgba(0,0,0,0.1)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 4;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  
  y += 50;
  
  // 恋爱风格
  ctx.fillStyle = '#24292e';
  ctx.font = 'bold 28px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('恋爱风格', 80, y);
  
  y += 50;
  
  ctx.fillStyle = '#586069';
  ctx.font = '400 22px "Noto Sans SC", sans-serif';
  wrapText(ctx, personality.loveStyle, 80, y, W - 160, 36);
  
  y += 150;
  
  // 建议搭配
  ctx.fillStyle = '#24292e';
  ctx.font = 'bold 28px "Noto Sans SC", sans-serif';
  ctx.fillText('建议搭配', 80, y);
  
  y += 50;
  
  ctx.fillStyle = '#047857';
  ctx.font = 'bold 24px "Noto Sans SC", sans-serif';
  ctx.fillText(personality.bestMatch.type, 80, y);
  
  y += 40;
  
  ctx.fillStyle = '#059669';
  ctx.font = '400 20px "Noto Sans SC", sans-serif';
  wrapText(ctx, personality.bestMatch.reason, 80, y, W - 160, 32);
  
  y += 200;
  
  // 底部信息
  ctx.fillStyle = '#6a737d';
  ctx.font = '400 20px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('恋爱16型人格测试 · 长按保存', W/2, y);
  
  // 下载
  const link = document.createElement('a');
  link.download = `恋爱人格_${type}_${personality.name}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const chars = text.split('');
  let line = '';
  let currentY = y;
  
  for (let i = 0; i < chars.length; i++) {
    const testLine = line + chars[i];
    const metrics = ctx.measureText(testLine);
    
    if (metrics.width > maxWidth && i > 0) {
      ctx.fillText(line, x, currentY);
      line = chars[i];
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, currentY);
}

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>记账系统 Pro</title>

<style>
body{
    font-family: Arial;
    width: 900px;
    margin: auto;
    margin-top: 30px;
}

input,select,button{
    padding:6px;
    margin:4px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #999;
    padding:8px;
    text-align:center;
}

img{
    width:70px;
}

.top{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
}

#total{
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>📒 记账系统 Pro</h2>

<div class="top">

<input id="project" placeholder="项目">

<input id="cost" type="number" placeholder="花费">

<select id="type">
<option>发票</option>
<option>收据</option>
<option>车票</option>
<option>餐饮</option>
<option>其他</option>
</select>

<input type="file" id="img">

<button onclick="add()">添加</button>

<button onclick="exportCSV()">导出Excel</button>

<input id="search" placeholder="搜索项目" oninput="render()">

</div>

<div id="total">总支出：0</div>

<table>
<thead>
<tr>
<th>编号</th>
<th>日期</th>
<th>项目</th>
<th>花费</th>
<th>类型</th>
<th>图片</th>
<th>操作</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>

<script>

let data = JSON.parse(localStorage.getItem("money")) || [];

function save(){
    localStorage.setItem("money",JSON.stringify(data));
}

function getID(){
    return "EXP" + String(data.length+1).padStart(4,"0");
}

function add(){
    let file = document.getElementById("img").files[0];

    if(file){
        let reader = new FileReader();
        reader.onload = function(){
            push(reader.result);
        }
        reader.readAsDataURL(file);
    }else{
        push("");
    }
}

function push(img){
    let item = {
        id: getID(),
        date: new Date().toLocaleDateString(),
        project: project.value,
        cost: parseFloat(cost.value || 0),
        type: type.value,
        img: img
    };

    data.push(item);
    save();
    render();
}

function del(i){
    data.splice(i,1);
    save();
    render();
}

function render(){

    let key = search.value || "";

    let tb = document.getElementById("tb");
    tb.innerHTML = "";

    let total = 0;

    data.forEach((d,i)=>{

        if(key && !d.project.includes(key)) return;

        total += d.cost;

        tb.innerHTML += `
        <tr>
        <td>${d.id}</td>
        <td>${d.date}</td>
        <td>${d.project}</td>
        <td>${d.cost}</td>
        <td>${d.type}</td>
        <td>${d.img ? `<img src="${d.img}">` : ""}</td>
        <td><button onclick="del(${i})">删除</button></td>
        </tr>
        `;
    });

    totalDiv = document.getElementById("total");
    totalDiv.innerText = "总支出：" + total.toFixed(2);
}

function exportCSV(){

    let csv = "编号,日期,项目,花费,类型\n";

    data.forEach(d=>{
        csv += `${d.id},${d.date},${d.project},${d.cost},${d.type}\n`;
    });

    let blob = new Blob(["\ufeff"+csv],{type:"text/csv"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "记账.csv";
    a.click();
}

render();

</script>

</body>
</html>

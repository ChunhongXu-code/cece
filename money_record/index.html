<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📒 记账系统 Pro+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto">
        <!-- 标题 -->
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold text-gray-800">📒 记账系统 Pro+</h1>
            <button onclick="exportToExcel()" 
                    class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg flex items-center gap-2">
                📥 导出 Excel
            </button>
        </div>

        <!-- 添加记录区域 -->
        <div class="bg-white p-6 rounded-xl shadow mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <!-- 支付方式 -->
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">支付方式</label>
                    <select id="type" class="w-full px-3 py-2 border rounded-lg">
                        <option value="微信支付">微信支付</option>
                        <option value="微信转账">微信转账</option>
                        <option value="发票">发票</option>
                        <option value="收据">收据</option>
                        <option value="现金">现金</option>
                    </select>
                </div>

                <!-- 金额 -->
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">金额</label>
                    <input type="number" id="amount" placeholder="0.00" 
                           class="w-full px-3 py-2 border rounded-lg">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-600 mb-1">备注</label>
                <input type="text" id="note" placeholder="可选备注" 
                       class="w-full px-3 py-2 border rounded-lg">
            </div>

            <button onclick="addRecord()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium flex items-center justify-center gap-2">
                ➕ 添加记录
            </button>
        </div>

        <!-- 统计 -->
        <div class="bg-white p-4 rounded-xl shadow mb-6 flex items-center justify-between">
            <span class="text-lg font-medium text-gray-700">总支出</span>
            <span id="total" class="text-3xl font-bold text-red-500">0</span>
        </div>

        <!-- 记录列表 -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">日期</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">类型</th>
                        <th class="px-4 py-3 text-right text-sm font-medium text-gray-600">金额</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-600">备注</th>
                        <th class="px-4 py-3 text-center text-sm font-medium text-gray-600">操作</th>
                    </tr>
                </thead>
                <tbody id="recordList" class="divide-y"></tbody>
            </table>
        </div>
    </div>

    <script>
        let records = [];

        function addRecord() {
            const type = document.getElementById('type').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const note = document.getElementById('note').value.trim();

            if (!amount || amount <= 0) {
                alert("请输入有效的金额");
                return;
            }

            const record = {
                date: new Date().toLocaleDateString('zh-CN'),
                type: type,
                amount: amount,
                note: note || '-'
            };

            records.push(record);
            renderRecords();
            updateTotal();

            // 清空输入
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
        }

        function renderRecords() {
            const tbody = document.getElementById('recordList');
            tbody.innerHTML = '';

            records.forEach((record, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-4 py-3 text-sm text-gray-600">${record.date}</td>
                    <td class="px-4 py-3">
                        <span class="px-2 py-1 bg-blue-100 text-blue-700 text-xs rounded">${record.type}</span>
                    </td>
                    <td class="px-4 py-3 text-right font-medium text-red-500">¥${record.amount}</td>
                    <td class="px-4 py-3 text-sm text-gray-600">${record.note}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="deleteRecord(${index})" 
                                class="text-red-500 hover:text-red-700 text-sm">删除</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function deleteRecord(index) {
            records.splice(index, 1);
            renderRecords();
            updateTotal();
        }

        function updateTotal() {
            const total = records.reduce((sum, r) => sum + r.amount, 0);
            document.getElementById('total').textContent = total.toFixed(2);
        }

        function exportToExcel() {
            if (records.length === 0) {
                alert("暂无记录可导出");
                return;
            }

            // 准备导出数据
            const data = records.map(r => ({
                日期: r.date,
                类型: r.type,
                金额: r.amount,
                备注: r.note
            }));

            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "支出记录");

            // 下载文件
            XLSX.writeFile(workbook, `记账记录_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        // 初始示例数据（可删除）
        function initDemoData() {
            records = [
                { date: "2026/7/3", type: "微信支付", amount: 25.5, note: "午餐" },
                { date: "2026/7/3", type: "现金", amount: 18, note: "打车" }
            ];
            renderRecords();
            updateTotal();
        }

        // 启动时加载演示数据（可选）
        window.onload = function() {
            initDemoData();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>图书馆</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top-bar">
  <h1 id="page-title">书架</h1>
  <button class="icon-btn" id="btn-search-toggle"><i class="fas fa-search"></i></button>
</header>
<div class="search-bar" id="search-bar">
  <input type="text" id="searchInput" placeholder="搜索书架…">
</div>
<main class="main-content">

  <!-- 书架 -->
  <section id="view-books" class="view active">
    <div class="filter-chips">
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip" data-filter="reading">在读</button>
      <button class="chip" data-filter="finished">已读</button>
      <button class="chip" data-filter="wishlist">想读</button>
    </div>
    <div id="books-grid" class="books-grid"></div>
  </section>

  <!-- 书库 -->
  <section id="view-explore" class="view">
    <div class="explore-search">
      <div class="explore-input-row">
        <input type="text" id="explore-query" placeholder="搜书名、作者、ISBN…">
        <button class="btn-sm" id="btn-explore"><i class="fas fa-search"></i> 搜</button>
      </div>
      <div class="explore-tips">
        <span class="etag" data-q="生命不能承受之轻">生命不能承受之轻</span>
        <span class="etag" data-q="荆棘鸟">荆棘鸟</span>
        <span class="etag" data-q="百年孤独">百年孤独</span>
        <span class="etag" data-q="活着 余华">活着</span>
        <span class="etag" data-q="挪威的森林">挪威的森林</span>
        <span class="etag" data-q="卡拉马佐夫兄弟">卡拉马佐夫</span>
        <span class="etag" data-q="追忆似水年华">追忆似水年华</span>
        <span class="etag" data-q="红楼梦">红楼梦</span>
      </div>
    </div>
    <div id="explore-status"></div>
    <div id="explore-results" class="explore-results"></div>
  </section>

  <!-- 课题 -->
  <section id="view-topics" class="view">
    <div class="topics-header">
      <p class="topics-sub">每本书都在回答某个课题</p>
      <button class="btn-new" id="btn-new-topic"><i class="fas fa-plus"></i> 新建课题</button>
    </div>
    <div id="topics-list" class="topics-list"></div>
    <div id="topic-detail" style="display:none"></div>
  </section>

  <!-- 设置 -->
  <section id="view-settings" class="view">
    <div class="sg">
      <h3>数据</h3>
      <button class="sb" id="btn-export"><i class="fas fa-download"></i> 导出备份</button>
      <button class="sb" id="btn-import"><i class="fas fa-upload"></i> 导入恢复</button>
      <input type="file" id="import-file" accept=".json" hidden>
      <button class="sb danger" id="btn-clear"><i class="fas fa-trash"></i> 清空数据</button>
    </div>
    <div class="sg">
      <h3>统计</h3>
      <div class="sr"><span>书籍</span><strong id="s-books">0</strong></div>
      <div class="sr"><span>笔记</span><strong id="s-notes">0</strong></div>
      <div class="sr"><span>课题</span><strong id="s-topics">0</strong></div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="ni active" data-view="books"><i class="fas fa-book"></i><span>书架</span></button>
  <button class="ni" data-view="explore"><i class="fas fa-compass"></i><span>书库</span></button>
  <button class="ni fab" id="btn-add"><i class="fas fa-plus"></i></button>
  <button class="ni" data-view="topics"><i class="fas fa-tags"></i><span>课题</span></button>
  <button class="ni" data-view="settings"><i class="fas fa-cog"></i><span>设置</span></button>
</nav>

<div class="fab-menu" id="fab-menu">
  <button class="fo" data-action="add-book"><span>添加书籍</span><i class="fas fa-book-medical"></i></button>
  <button class="fo" data-action="add-note"><span>添加笔记</span><i class="fas fa-pen-fancy"></i></button>
</div>
<div class="overlay" id="overlay"></div>

<!-- 添加书籍 -->
<div class="modal" id="modal-book">
  <div class="ms">
    <div class="sh"></div>
    <h2 id="mb-title">添加书籍</h2>
    <form id="form-book">
      <div class="fg"><label>搜索（书名/ISBN）</label>
        <div class="ir">
          <input type="text" id="bq" placeholder="如：百年孤独">
          <button type="button" class="btn-sm" id="btn-fetch"><i class="fas fa-search"></i> 搜</button>
        </div>
        <div id="fetch-results"></div>
      </div>
      <div class="fd"><span>或手动填写</span></div>
      <div class="fg"><label>书名 *</label><input type="text" id="bt" required></div>
      <div class="fg"><label>作者</label><input type="text" id="ba"></div>
      <div class="fg"><label>封面URL</label><input type="url" id="bc"><div id="cpv"></div></div>
      <div class="fg"><label>简介</label><textarea id="bd" rows="2"></textarea></div>
      <div class="fr">
        <div class="fg f1"><label>状态</label><select id="bs"><option value="reading">在读</option><option value="finished">已读</option><option value="wishlist">想读</option></select></div>
        <div class="fg f1"><label>评分</label><select id="br"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></div>
      </div>
      <input type="hidden" id="beid">
      <div class="fa"><button type="button" class="bc-btn" onclick="CM('modal-book')">取消</button><button type="submit" class="bp">保存</button></div>
    </form>
  </div>
</div>

<!-- 快速加入 -->
<div class="modal" id="modal-quick">
  <div class="ms">
    <div class="sh"></div>
    <h2>加入书架</h2>
    <div id="q-preview" class="qp"></div>
    <form id="form-quick">
      <div class="fg"><label>状态</label>
        <div class="st">
          <button type="button" class="stb active" data-s="wishlist"><i class="fas fa-bookmark"></i>想读</button>
          <button type="button" class="stb" data-s="reading"><i class="fas fa-book-open"></i>在读</button>
          <button type="button" class="stb" data-s="finished"><i class="fas fa-check"></i>已读</button>
        </div>
      </div>
      <input type="hidden" id="q-data">
      <input type="hidden" id="q-status" value="wishlist">
      <div class="fa"><button type="button" class="bc-btn" onclick="CM('modal-quick')">取消</button><button type="submit" class="bp">确认</button></div>
    </form>
  </div>
</div>

<!-- 笔记 -->
<div class="modal" id="modal-note">
  <div class="ms">
    <div class="sh"></div>
    <h2>添加笔记</h2>
    <form id="form-note">
      <div class="fg"><label>选择书籍 *</label><select id="nb" required><option value="">— 选择 —</option></select></div>
      <div class="fg"><label>类型</label>
        <div class="tt">
          <button type="button" class="tb active" data-type="quote"><i class="fas fa-quote-left"></i> 摘抄</button>
          <button type="button" class="tb" data-type="thought"><i class="fas fa-lightbulb"></i> 感悟</button>
        </div>
      </div>
      <div class="fg"><label>内容 *</label><textarea id="nc" rows="4" required></textarea></div>
      <div class="fg"><label>我的想法</label><textarea id="nm" rows="2"></textarea></div>
      <div class="fg"><label>关联课题</label><div id="tp" class="tp"></div></div>
      <div class="fg"><label>页码</label><input type="number" id="np" min="1"></div>
      <input type="hidden" id="nt" value="quote">
      <input type="hidden" id="neid">
      <div class="fa"><button type="button" class="bc-btn" onclick="CM('modal-note')">取消</button><button type="submit" class="bp">保存</button></div>
    </form>
  </div>
</div>

<!-- 课题 -->
<div class="modal" id="modal-topic">
  <div class="ms">
    <div class="sh"></div>
    <h2>新建课题</h2>
    <form id="form-topic">
      <div class="fg"><label>名称 *</label><input type="text" id="tn" placeholder="如：如何面对孤独" required></div>
      <div class="fg"><label>描述</label><textarea id="td" rows="2"></textarea></div>
      <div class="fg"><label>颜色</label>
        <div class="cpk" id="cpk">
          <span class="cd active" data-c="#6c63ff" style="background:#6c63ff"></span>
          <span class="cd" data-c="#ff6b9d" style="background:#ff6b9d"></span>
          <span class="cd" data-c="#4ecdc4" style="background:#4ecdc4"></span>
          <span class="cd" data-c="#ffe66d" style="background:#ffe66d"></span>
          <span class="cd" data-c="#ff8a5c" style="background:#ff8a5c"></span>
          <span class="cd" data-c="#a8e6cf" style="background:#a8e6cf"></span>
          <span class="cd" data-c="#dda0dd" style="background:#dda0dd"></span>
          <span class="cd" data-c="#87ceeb" style="background:#87ceeb"></span>
        </div>
      </div>
      <input type="hidden" id="tc" value="#6c63ff">
      <input type="hidden" id="teid">
      <div class="fa"><button type="button" class="bc-btn" onclick="CM('modal-topic')">取消</button><button type="submit" class="bp">保存</button></div>
    </form>
  </div>
</div>

<!-- 详情 -->
<div class="modal" id="modal-detail">
  <div class="ms msl">
    <div class="sh"></div>
    <button class="mcb" onclick="CM('modal-detail')"><i class="fas fa-times"></i></button>
    <div id="dc"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
